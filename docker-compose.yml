# Optional: PostgreSQL in Docker. If you already run PostgreSQL natively on Windows,
# you can skip this file (see README).
services:
  postgres:
    image: postgres:18-alpine
    container_name: datavello-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datavello}
      POSTGRES_USER: ${POSTGRES_USER:-datavello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datavello-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datavello-pgdata:
